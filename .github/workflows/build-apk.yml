
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit); unzip "$ZIP_FILE" -d project

      - name: Build APK
        run: |
          cd project/iOSLauncher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Experience-Launcher-APK
          path: project/iOSLauncher/app/build/outputs/apk/debug/app-debug.apk
